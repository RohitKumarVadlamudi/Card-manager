<!DOCTYPE html>
<html>
<head>
    <title>Card List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="header">
        <a href="{{ url_for('add_card') }}" class="add-card-button">Add Card</a>
    </div>

    <h1>All Credit Cards</h1>
    <ul>
        {% for card in cards %}
            <li>
                <a href="/card/{{ card.id }}">{{ card.name }} - Due Date: {{ card.due_date }} - Min Payment: ${{ card.minimum_payment }} - Status: {{ 'Paid' if card.paid else 'Not Paid' }}</a>
            </li>
        {% endfor %}
    </ul>
    <footer>
        <p>A product by Rohit Vadlamudi</p>
    </footer>
</body>
</html>
